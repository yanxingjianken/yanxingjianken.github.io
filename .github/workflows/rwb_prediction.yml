name: RWB prediction check (daily)

# ERA5T reaches the Climate Data Store about five days after real time; the job runs once a day, fetches the ERA5T
# days not yet cached on the Hugging Face dataset, scores every issue time whose 24-h window is now covered, and
# uploads the results.  Nothing is committed to this repository by this workflow.
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

concurrency:
  group: rwb-prediction
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipelines/rwb_prediction
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/rwb_prediction/requirements.txt
      - name: Install dependencies
        run: pip install -r pipelines/rwb_prediction/requirements.txt
      - name: Tests
        run: cd pipelines/rwb_prediction && python -m pytest -q tests
      - name: Score and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: yanxingjianken/rwb-prediction
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY || secrets.ECDS_API || secrets.ECDS_API_KEY }}
        run: cd pipelines/rwb_prediction && python run_pipeline.py
