name: NH forecast dataset (6-hourly runs, checked hourly)

# GFS 0.25 deg is complete on AWS ~4.7 h after each synoptic time; ECMWF AIFS-single
# ~5.5 h; ECMWF IFS ~6.5-7.5 h (its 06/18 UTC cycles stop at 144 h).  GitHub's cron is best-effort (delays of hours happen), so the job runs
# hourly and is idempotent: it publishes a model only when a newer complete run
# exists than the one recorded in index.json on the Hub, otherwise it exits in
# under a minute.  All data go to the Hugging Face dataset; nothing is committed
# to this repository by this workflow.
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated models (gfs,aifs,ifs)"
        required: false
        default: "gfs,aifs,ifs"
      run:
        description: "Force run id YYYYMMDDHH (blank = latest complete run)"
        required: false
        default: ""
      force:
        description: "Republish even if already on the Hub (true/false)"
        required: false
        default: "false"

concurrency:
  group: nh-forecast
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipelines/nh_forecast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/nh_forecast/requirements.txt
      - name: Install dependencies
        run: pip install -r pipelines/nh_forecast/requirements.txt
      - name: Build and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: yanxingjianken/nh-forecast-6hourly
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          cd pipelines/nh_forecast
          EXTRA="--models ${{ github.event.inputs.models || 'gfs,aifs,ifs' }}"
          if [ -n "${{ github.event.inputs.run }}" ]; then EXTRA="$EXTRA --run ${{ github.event.inputs.run }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then EXTRA="$EXTRA --force"; fi
          # squash the dataset history once a week (Sunday, 05Z hour) to keep storage small
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "05" ]; then EXTRA="$EXTRA --squash"; fi
          python run_pipeline.py $EXTRA
