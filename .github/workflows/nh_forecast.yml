name: NH forecast dataset (6-hourly)

# GFS 0.25 deg runs are complete on AWS ~4 h after initialisation; the crons
# below run ~4.5 h after each synoptic time.  All data go to the Hugging Face
# dataset; nothing is committed to this repository by this workflow.
on:
  schedule:
    - cron: "35 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Force run id YYYYMMDDHH (blank = latest complete run)"
        required: false
        default: ""
      max_step:
        description: "Last forecast hour"
        required: false
        default: "240"

concurrency:
  group: nh-forecast
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipelines/nh_forecast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/nh_forecast/requirements.txt
      - name: Install dependencies
        run: pip install -r pipelines/nh_forecast/requirements.txt
      - name: Build and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: yanxingjianken/nh-forecast-6hourly
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: |
          cd pipelines/nh_forecast
          EXTRA=""
          if [ -n "${{ github.event.inputs.run }}" ]; then EXTRA="$EXTRA --run ${{ github.event.inputs.run }}"; fi
          if [ -n "${{ github.event.inputs.max_step }}" ]; then EXTRA="$EXTRA --max-step ${{ github.event.inputs.max_step }}"; fi
          # squash the dataset history once a week (Sunday 00Z run) to keep storage small
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "04" ]; then EXTRA="$EXTRA --squash"; fi
          python run_pipeline.py $EXTRA
